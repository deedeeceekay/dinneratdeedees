<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Dinner at Dee Dee's</title>
<link rel="icon" href="images/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#2a2522}a:hover{color:#6b5a4c}</style>
<style>img{max-width:100%}</style>
</head>
<body>
<div style="font-family: 'Lora', Georgia, serif; color: #2a2522; background: #f5f1ea">

<header style="background: #2d2421; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 64px; font-family: 'Lora', Georgia, serif; color: #f5f1ea">
<a href="index.html" style="display: block; padding: 6px 0"><img src="images/logo.webp" alt="Dinner at Dee Dee's" style="display: block; width: 200px; height: auto"></a>
<nav style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 14px">
<a href="about.html" style="text-decoration: none; color: #f5f1ea; padding: 12px 0">About</a>
<a href="events.html" style="text-decoration: none; color: #f5f1ea; padding: 12px 0">Events</a>
<a href="journal.html" style="text-decoration: none; color: #f5f1ea; padding: 12px 0">Journal</a>
<a href="recipes.html" style="text-decoration: none; color: #f5f1ea; padding: 12px 0">Recipes</a>
<a href="contact.html" style="text-decoration: none; color: #f5f1ea; padding: 12px 0">Contact</a>
</nav>
</header>

<section style="max-width: 1200px; margin: 0 auto; padding: 120px 48px; display: flex; flex-wrap: wrap; gap: 96px">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 300; font-size: 56px">Contact Me</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.75">Please fill out the form below for any enquiries, collaboration requests, or just a chat!</p>
<a href="mailto:deedee@dinneratdeedees.com" style="font-size: 16px; padding: 12px 0">deedee@dinneratdeedees.com</a>
</div>
<form style="flex: 1 1 480px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px">
<label for="c-first" style="font-size: 14px">First name</label>
<input id="c-first" type="text" style="height: 48px; border: 1px solid #8a7d70; background: #fffdf9; padding: 0 12px; font: inherit">
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px">
<label for="c-last" style="font-size: 14px">Last name</label>
<input id="c-last" type="text" style="height: 48px; border: 1px solid #8a7d70; background: #fffdf9; padding: 0 12px; font: inherit">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-email" style="font-size: 14px">Email</label>
<input id="c-email" type="email" style="height: 48px; border: 1px solid #8a7d70; background: #fffdf9; padding: 0 12px; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-msg" style="font-size: 14px">Message</label>
<textarea id="c-msg" rows="6" style="border: 1px solid #8a7d70; background: #fffdf9; padding: 12px; font: inherit"></textarea>
</div>
<button type="button" style="align-self: flex-start; min-height: 48px; padding: 0 36px; background: #2d2421; color: #f5f1ea; border: 0; font: inherit; font-size: 14px; letter-spacing: 1px; cursor: pointer">Send</button>
</form>
</section>

<footer style="background: #2d2421; color: #f5f1ea; padding: 32px 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-family: 'Lora', Georgia, serif; font-size: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<img src="images/logo.webp" alt="Dinner at Dee Dee's" style="display: block; width: 180px; height: auto">
<span>For friends. By friends.</span>
</div>
<a href="mailto:deedee@dinneratdeedees.com" style="color: #f5f1ea; padding: 12px 0">deedee@dinneratdeedees.com</a>
</footer>

</div>
</body>
</html>
